# =============================================================================
# Codemagic CI — Articals Logistics
#
# Project type in the Codemagic UI: **Android**. This is a Kotlin Multiplatform +
# Compose Multiplatform app built with Gradle from the repository root; it is not a
# Flutter, React Native, MAUI, Ionic or Unity project, so the Android type is the one
# that brings the right toolchain. The iOS workflow arrives with `iosApp/`, which is
# still to be written (docs/COMPILE_CHECKLIST.md §5) and needs a macOS instance and
# the Xcode project that does not exist yet.
#
# Three workflows, in the order they are useful today:
#
#   android-checks    The first real compile. Nothing in this repository has been
#                     through a Kotlin compiler — no Android SDK and no Kotlin
#                     compiler exist in the environment where it was written — so
#                     this workflow is where that changes. It compiles the shared
#                     module, runs the 88 tests, and needs no secrets at all.
#                     It runs on every push.
#
#   android-demo      The APKs a reviewer installs. Demo mode is the default, so this
#                     needs no Firebase project, no google-services.json and no
#                     keystore: it builds the company app and, separately, the admin
#                     console build used for the walkthrough's console steps.
#                     Started by hand.
#
#   android-release   A signed pilot release against the real backend
#                     (-Particals.mode=firebase). Refuses to run without the two
#                     secrets below. Started by hand.
#
# Secrets this file expects, and where they go:
#
#   1. Android keystore — Codemagic → Team settings → Code signing identities →
#      Android keystores → reference name `articals_keystore`. Codemagic exports
#      CM_KEYSTORE_PATH / CM_KEYSTORE_PASSWORD / CM_KEY_ALIAS / CM_KEY_PASSWORD, which
#      `androidApp/build.gradle.kts` reads to sign the release variant. Without them
#      the release variant is simply built unsigned, exactly as before.
#
#   2. google-services.json — base64-encoded, as a variable named
#      GOOGLE_SERVICES_JSON_BASE64 in an environment group called `firebase`:
#          base64 < androidApp/google-services.json | tr -d '\n'
#      The decoded file is written into androidApp/ during the build only. The file
#      itself is git-ignored and must never be committed (docs/SETUP.md §3).
#
# Nothing here ever passes -Pallow.demo.release=true: a demo build must not be
# shippable (ADR-013), and no workflow does automation that could produce one.
# =============================================================================

workflows:

  # ---------------------------------------------------------------------------
  # 1. Compile the shared module and run the tests.
  # ---------------------------------------------------------------------------
  android-checks:
    name: Android checks — compile and tests (demo mode)
    # Generous: the first run downloads the Kotlin/Native toolchain for the iOS targets
    # of the shared module. Later runs hit the $HOME/.konan cache.
    max_build_duration: 180
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        GRADLE_VERSION: "9.6.0"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.konan
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Point Gradle at the Android SDK
        script: |
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties
      - name: Install the platform this build compiles against
        script: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # compileSdk and targetSdk are 37 (docs/VERSIONS.md, the maximum AGP 9.4
          # supports). The Codemagic images carry platforms up to android-36.1, so ask
          # for 37 explicitly and let AGP download it if sdkmanager does not publish it
          # yet — either way the build fails with a readable message rather than
          # half way through compilation.
          "$SDKMANAGER" "platforms;android-37" > /dev/null 2>&1 \
            || echo "platforms;android-37 was not installed by sdkmanager; AGP will try to fetch it."
      - name: Restore the Gradle wrapper if it is missing
        script: |
          # A no-op in a normal checkout: the wrapper is committed, so `./gradlew` is
          # already there. It exists for a checkout that lost the binary files — and it
          # needs no Gradle and no JDK to do its job (tools/ci/ensure_gradle_wrapper.sh).
          bash tools/ci/ensure_gradle_wrapper.sh "$GRADLE_VERSION"
      - name: Compile the shared Kotlin (fast pass, before the iOS toolchain)
        script: |
          # Metadata compilation of commonMain: the quickest way to see unresolved
          # references and type errors in the shared code, without waiting for the
          # Kotlin/Native toolchain that the tests below need.
          ./gradlew --console=plain --stacktrace :composeApp:compileKotlinMetadata
      - name: Compile every target and run the tests
        script: |
          # `allTests` is Kotlin Multiplatform's aggregate: the Android host tests plus
          # the Kotlin/Native targets, so this compiles the iOS half of the shared
          # module too. The first run downloads the Kotlin/Native toolchain for those
          # targets (~1 GB); $HOME/.konan is cached, so it is paid once. If the iosX64
          # test binary turns out to be awkward on Apple silicon, narrow this to
          # `:composeApp:iosSimulatorArm64Test :composeApp:testDebugUnitTest` and say so
          # in docs/COMPILE_CHECKLIST.md. If a task name here is wrong, the log will say
          # "Task ... not found"; `./gradlew :composeApp:tasks --all` lists the real ones
          # (trap 8 in docs/COMPILE_CHECKLIST.md §3).
          ./gradlew --console=plain --stacktrace :composeApp:allTests
    artifacts:
      - composeApp/build/reports/tests/**
      - composeApp/build/test-results/**
    # Add `publishing: email:` here to have results mailed to the team.

  # ---------------------------------------------------------------------------
  # 2. The demo builds — no secrets, no Firebase project, no network.
  # ---------------------------------------------------------------------------
  android-demo:
    name: Android demo builds — company and admin console (no secrets)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        GRADLE_VERSION: "9.6.0"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.konan
    scripts:
      - name: Point Gradle at the Android SDK
        script: |
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties
      - name: Restore the Gradle wrapper if it is missing
        script: |
          # A no-op in a normal checkout: the wrapper is committed, so `./gradlew` is
          # already there. It exists for a checkout that lost the binary files — and it
          # needs no Gradle and no JDK to do its job (tools/ci/ensure_gradle_wrapper.sh).
          bash tools/ci/ensure_gradle_wrapper.sh "$GRADLE_VERSION"
      - name: Build the company demo app
        script: |
          ./gradlew --console=plain :androidApp:assembleCompanyDebug
      - name: Build the admin console demo app
        script: |
          ./gradlew --console=plain :androidApp:assembleAdminDebug
      - name: Report what was built
        script: |
          echo "Company app: $(ls -1 androidApp/build/outputs/apk/company/debug/*.apk)"
          echo "Console app: $(ls -1 androidApp/build/outputs/apk/admin/debug/*.apk)"
          echo "Both are demo builds: no Firebase project, no credentials."
    artifacts:
      - androidApp/build/outputs/apk/company/debug/*.apk
      - androidApp/build/outputs/apk/admin/debug/*.apk

  # ---------------------------------------------------------------------------
  # 3. The signed pilot release, against the real backend.
  # ---------------------------------------------------------------------------
  android-release:
    name: Android pilot release — Firebase mode, signed
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
      android_signing:
        - articals_keystore
      groups:
        - firebase
      vars:
        GRADLE_VERSION: "9.6.0"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.konan
    scripts:
      - name: Point Gradle at the Android SDK
        script: |
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties
      - name: Restore the Gradle wrapper if it is missing
        script: |
          # A no-op in a normal checkout: the wrapper is committed, so `./gradlew` is
          # already there. It exists for a checkout that lost the binary files — and it
          # needs no Gradle and no JDK to do its job (tools/ci/ensure_gradle_wrapper.sh).
          bash tools/ci/ensure_gradle_wrapper.sh "$GRADLE_VERSION"
      - name: Refuse to build a release without the Firebase configuration
        script: |
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 is not set."
            echo "A firebase-mode release without it installs an app that cannot sign in"
            echo "(it shows 'Firebase is not configured' and points at docs/SETUP.md),"
            echo "which is not something to hand to a pilot. Add the variable to the"
            echo "'firebase' environment group and run this workflow again."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > androidApp/google-services.json
          echo "google-services.json written for this build only ($(wc -c < androidApp/google-services.json) bytes)."
      - name: Build the signed release
        script: |
          ./gradlew --console=plain \
            :androidApp:assembleCompanyRelease \
            :androidApp:bundleCompanyRelease \
            -Particals.mode=firebase
      - name: Verify the release is signed and carries the configuration
        script: |
          apk="$(ls -1 androidApp/build/outputs/apk/company/release/*.apk | head -1)"
          echo "Release APK: $apk"
          apksigner="$(ls -1 "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)"
          # Signed with the uploaded keystore: verify rather than assume.
          "$apksigner" verify --print-certs "$apk" | head -3
          # The google-services plugin writes the project's numeric app id into the
          # packaged resources; without it the app cannot initialise Firebase and would
          # show the "not configured" screen to a pilot.
          if unzip -p "$apk" resources.arsc | strings | grep -q "google_app_id"; then
            echo "Firebase configuration is packaged in the release."
          else
            echo "google_app_id is missing from the release; refusing to publish it."
            exit 1
          fi
    artifacts:
      - androidApp/build/outputs/apk/company/release/*.apk
      - androidApp/build/outputs/bundle/companyRelease/*.aab
      - androidApp/build/outputs/mapping/company/release/mapping.txt
    # Play publishing is deliberately not configured: the pilot installs the APK
    # directly, and a Play service account is the owner's decision to make.
