# Gradle / Kotlin build configuration for Articals Logistics.

# --- Gradle daemon ---------------------------------------------------------
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# --- Kotlin ----------------------------------------------------------------
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# Compose Multiplatform resource generation must run before compilation.
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true

# --- Android ---------------------------------------------------------------
# AGP 9 enables its built-in Kotlin support; the KMP module uses the
# `com.android.kotlin.multiplatform.library` plugin instead (ADR-012).
android.builtInKotlin=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# Keep the number of variants manageable for a two-flavor build.
android.enableJetifier=false
